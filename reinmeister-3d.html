<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reinmeister · 3D Product Viewer</title>
<!-- Favicon: white R on black background -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><text x='6' y='24' font-family='Arial' font-weight='bold' font-size='22' fill='white'>R</text></svg>">
<style>
/* ── Reset ─────────────────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

/* ── Canvas ─────────────────────────────────────────────────── */
#c{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh}

/* ── Loading overlay ─────────────────────────────────────────── */
#loading{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .8s ease}
#loading.fade{opacity:0;pointer-events:none}
#loading-text{color:rgba(255,255,255,.6);font-size:12px;letter-spacing:3px;text-transform:uppercase;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ── UI wrapper ─────────────────────────────────────────────── */
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}

/* ── Top-left brand ─────────────────────────────────────────── */
#brand{position:absolute;top:24px;left:28px}
#b-eye{color:rgba(255,255,255,.5);font-size:10px;letter-spacing:4px;text-transform:uppercase;margin-bottom:4px}
#b-title{color:#fff;font-size:28px;font-weight:700;line-height:1;margin-bottom:5px}
#b-sub{color:rgba(255,255,255,.4);font-size:11px;letter-spacing:6px;text-transform:uppercase}

/* ── Top-right live badge ────────────────────────────────────── */
#live{position:absolute;top:24px;right:28px;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 14px 7px 10px}
#dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e;animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
#live-txt{color:rgba(255,255,255,.85);font-size:11px;font-weight:600;letter-spacing:2px}

/* ── Bottom controls ─────────────────────────────────────────── */
#controls{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:all}
.btn{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.85);font-family:inherit;font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;padding:9px 18px;border-radius:999px;cursor:pointer;transition:background .2s,border-color .2s,color .2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.btn.on{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.5);color:#4ade80}

/* ── Hint ────────────────────────────────────────────────────── */
#hint{position:absolute;bottom:28px;left:28px;color:rgba(255,255,255,.32);font-size:10px;letter-spacing:2px;text-transform:uppercase}

/* ── Mobile ──────────────────────────────────────────────────── */
@media(max-width:700px){
  #b-title{font-size:20px}#b-eye{font-size:9px;letter-spacing:2px}#b-sub{font-size:9px;letter-spacing:3px}
  #controls{gap:6px;bottom:18px}.btn{font-size:10px;padding:8px 12px}
  #hint{display:none}#brand{top:16px;left:16px}#live{top:16px;right:16px}
}
</style>
</head>
<body>

<div id="loading"><div id="loading-text">Loading Scene</div></div>

<div id="ui">
  <div id="brand">
    <div id="b-eye">Pro Line · 3 Product Concept</div>
    <div id="b-title">Reinmeister.</div>
    <div id="b-sub">Professional · Made in Germany</div>
  </div>
  <div id="live">
    <div id="dot"></div>
    <div id="live-txt">LIVE 3D</div>
  </div>
  <div id="controls">
    <button class="btn on"  id="btn-rot">Auto Rotate</button>
    <button class="btn"     id="btn-rst">Reset View</button>
    <button class="btn"     id="btn-frt">Front</button>
    <button class="btn"     id="btn-cls">Close-Up</button>
  </div>
  <div id="hint">Drag · Scroll · Tap</div>
</div>

<canvas id="c"></canvas>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- OrbitControls for r128 (part of the three.js package) -->
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════
   REINMEISTER 3D PRODUCT VIEWER
   Three matte-black supplement bottles on pure black background.
   Labels are painted on HTML5 Canvas and wrapped as textures.
   ═══════════════════════════════════════════════════════════════ */
console.log('Reinmeister 3D Viewer · drag to rotate');

// ── Renderer ────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputEncoding    = THREE.sRGBEncoding;

// ── Scene ────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// ── Camera ───────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2.5, 13);

// ── OrbitControls ────────────────────────────────────────────────
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0, 1.8, 0);
controls.enableDamping   = true;
controls.dampingFactor   = 0.05;
controls.minDistance     = 4;
controls.maxDistance     = 24;
controls.minPolarAngle   = 0.3;
controls.maxPolarAngle   = Math.PI / 2 + 0.3;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.6;
controls.update();

// ── Window resize ────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ═══════════════════════════════════════════════════════════════
   PROCEDURAL ENVIRONMENT MAP
   Painted on a small canvas, converted to PMREMGenerator texture.
   Gives metallic surfaces realistic chrome reflections without HDRI.
   ═══════════════════════════════════════════════════════════════ */
function buildEnvMap() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();

  const W = 1024, H = 512;
  const ec  = document.createElement('canvas');
  ec.width  = W; ec.height = H;
  const ex  = ec.getContext('2d');

  // Dark gradient base
  const bg = ex.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0,   '#1a1a2e');
  bg.addColorStop(0.3, '#111122');
  bg.addColorStop(1,   '#000005');
  ex.fillStyle = bg;
  ex.fillRect(0, 0, W, H);

  // Key-light patch (upper-left)
  const k = ex.createRadialGradient(W * 0.35, H * 0.2, 0, W * 0.35, H * 0.2, W * 0.28);
  k.addColorStop(0,   'rgba(220,230,255,0.55)');
  k.addColorStop(0.5, 'rgba(160,180,230,0.18)');
  k.addColorStop(1,   'rgba(0,0,0,0)');
  ex.fillStyle = k;
  ex.fillRect(0, 0, W, H);

  // Warm rim-light patch (right side)
  const r = ex.createRadialGradient(W * 0.9, H * 0.35, 0, W * 0.9, H * 0.35, W * 0.22);
  r.addColorStop(0,   'rgba(255,180,100,0.35)');
  r.addColorStop(1,   'rgba(0,0,0,0)');
  ex.fillStyle = r;
  ex.fillRect(0, 0, W, H);

  const envTex = new THREE.CanvasTexture(ec);
  envTex.mapping  = THREE.EquirectangularReflectionMapping;
  envTex.encoding = THREE.sRGBEncoding;

  const envMap = pmrem.fromEquirectangular(envTex).texture;
  pmrem.dispose();
  envTex.dispose();
  return envMap;
}

const envMap = buildEnvMap();
scene.environment = envMap;

/* ═══════════════════════════════════════════════════════════════
   LIGHTING SETUP
   ═══════════════════════════════════════════════════════════════ */
// 1. Hemisphere ambient
scene.add(new THREE.HemisphereLight(0xddddff, 0x222244, 0.4));

// 2. Main key light (upper-left, casts shadows)
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(5, 10, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0001;
key.shadow.camera.near   =  1;
key.shadow.camera.far    = 40;
key.shadow.camera.left   = -10;
key.shadow.camera.right  =  10;
key.shadow.camera.top    =  10;
key.shadow.camera.bottom = -10;
scene.add(key);

// 3. Fill (cool, opposite side)
const fill = new THREE.DirectionalLight(0xaaccff, 0.5);
fill.position.set(-7, 4, 3);
scene.add(fill);

// 4. Rim (warm backlight)
const rim = new THREE.DirectionalLight(0xffaa66, 0.7);
rim.position.set(-2, 5, -8);
scene.add(rim);

// 5. Top accent point
const top = new THREE.PointLight(0xffffff, 0.5, 12);
top.position.set(0, 8, 4);
scene.add(top);

/* ═══════════════════════════════════════════════════════════════
   LABEL TEXTURE BUILDER
   2048×1024 canvas, fully transparent base (bottle's dark material
   shows through). Only white text/graphic elements are drawn.

   Canvas X layout (approximate):
     0   – 260  : left vertical text block
     260 – 600  : "Reinmeister®" brand hero (rotated 90° CCW)
     600 – 620  : 1px divider line
     620 – 950  : benefits bullet list
     950 – 2048 : giant hero number + MADE IN GERMANY footer

   To add bottle 4: duplicate a config entry, change x, number, text.
   ═══════════════════════════════════════════════════════════════ */
function buildLabel(cfg) {
  const W = 2048, H = 1024;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const cx = cv.getContext('2d');

  cx.clearRect(0, 0, W, H);  // transparent base

  /* LEFT: vertical product-line + subtitle text
     Rotated 90° CCW, pivoted at (120, H/2) */
  cx.save();
  cx.translate(120, H / 2);
  cx.rotate(-Math.PI / 2);
  cx.textAlign   = 'center';
  cx.textBaseline = 'alphabetic';

  cx.font      = 'italic 28px "Helvetica Neue",Helvetica,Arial,sans-serif';
  cx.fillStyle = '#ffffff';
  cx.fillText(cfg.productLine, 0, -18);

  cx.strokeStyle = 'rgba(255,255,255,0.35)';
  cx.lineWidth   = 1;
  cx.beginPath();
  cx.moveTo(-180, -6); cx.lineTo(180, -6);
  cx.stroke();

  cx.font = '28px "Helvetica Neue",Helvetica,Arial,sans-serif';
  cx.fillText(cfg.subtitle, 0, 22);
  cx.restore();

  /* CENTER: "Reinmeister®" brand hero — bold 180px, rotated 90° CCW */
  cx.save();
  cx.translate(420, H / 2 + 20);
  cx.rotate(-Math.PI / 2);
  cx.textAlign    = 'center';
  cx.textBaseline = 'alphabetic';
  cx.font      = 'bold 180px "Helvetica Neue",Helvetica,Arial,sans-serif';
  cx.fillStyle = '#ffffff';
  cx.fillText('Reinmeister', 0, 0);

  // Small ® superscript at the "top" end (positive x in rotated frame)
  const hw = cx.measureText('Reinmeister').width / 2;
  cx.font = 'bold 58px "Helvetica Neue",Helvetica,Arial,sans-serif';
  cx.fillText('®', hw + 28, -118);
  cx.restore();

  /* DIVIDER: 1px vertical white line */
  cx.strokeStyle = 'rgba(255,255,255,0.6)';
  cx.lineWidth   = 1.5;
  cx.beginPath();
  cx.moveTo(608, H * 0.1);
  cx.lineTo(608, H * 0.9);
  cx.stroke();

  /* RIGHT: benefits bullet list */
  cx.font      = '32px "Helvetica Neue",Helvetica,Arial,sans-serif';
  cx.fillStyle = '#ffffff';
  cx.textAlign    = 'left';
  cx.textBaseline = 'middle';
  const bx = 638, sy = H / 2 - 54, ls = 54;
  cfg.benefits.forEach((line, i) => {
    const y = sy + i * ls;
    cx.beginPath();
    cx.arc(bx + 8, y, 4, 0, Math.PI * 2);
    cx.fillStyle = 'rgba(255,255,255,0.7)';
    cx.fill();
    cx.fillStyle = '#ffffff';
    cx.fillText(line, bx + 24, y);
  });

  /* HERO NUMBER: massive, chrome gradient, right half of canvas
     Positioned in x≈950-2048, y≈lower 45%.
     Guaranteed no overlap with brand text (which is in x=260-600). */
  const nx = 1520, ny = H * 0.68;
  const ng = cx.createLinearGradient(nx, ny - 240, nx, ny + 260);
  ng.addColorStop(0,   '#ffffff');
  ng.addColorStop(0.4, '#cccccc');
  ng.addColorStop(1,   '#888888');

  cx.save();
  cx.font      = 'bold 580px "Helvetica Neue",Helvetica,Arial,sans-serif';
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.shadowColor   = 'rgba(0,0,0,0.4)';
  cx.shadowOffsetX = 0;
  cx.shadowOffsetY = 8;
  cx.shadowBlur    = 12;
  cx.fillStyle = ng;
  cx.fillText(cfg.heroNumber, nx, ny);
  cx.restore();

  /* BOTTOM: "MADE IN GERMANY" + German flag */
  const by = H - 38;
  cx.font         = 'bold 24px "Helvetica Neue",Helvetica,Arial,sans-serif';
  cx.fillStyle    = '#ffffff';
  cx.textAlign    = 'left';
  cx.textBaseline = 'middle';

  const madeStr = 'MADE IN GERMANY';
  const mw = cx.measureText(madeStr).width;
  const fw = 30, fh = 18, gap = 10;
  const tx = W / 2 - (mw + gap + fw) / 2;

  cx.fillText(madeStr, tx, by);

  // German flag (3 bars: black, red, gold)
  const fx = tx + mw + gap, fy = by - fh / 2, bh = fh / 3;
  cx.fillStyle = '#000000'; cx.fillRect(fx, fy,          fw, bh);
  cx.fillStyle = '#DD0000'; cx.fillRect(fx, fy + bh,     fw, bh);
  cx.fillStyle = '#FFCE00'; cx.fillRect(fx, fy + bh * 2, fw, bh);
  cx.strokeStyle = 'rgba(255,255,255,0.25)';
  cx.lineWidth   = 0.5;
  cx.strokeRect(fx, fy, fw, fh);

  const tex = new THREE.CanvasTexture(cv);
  tex.encoding    = THREE.sRGBEncoding;
  tex.needsUpdate = true;
  return tex;
}

/* ═══════════════════════════════════════════════════════════════
   BOTTLE FACTORY
   Creates one complete bottle group: body + cap + ridges + label + shadow.
   To add a 4th bottle, add a new config to bottleConfigs and the
   factory will handle the rest automatically.
   ═══════════════════════════════════════════════════════════════ */
function createBottle(cfg) {
  const g = new THREE.Group();
  g.position.x = cfg.x;

  /* Bottle body via LatheGeometry (profile: radius, y) */
  const pts = [
    new THREE.Vector2(0.00, 0.00),  // bottom centre
    new THREE.Vector2(0.85, 0.00),  // bottom edge
    new THREE.Vector2(1.00, 0.18),  // lower bevel
    new THREE.Vector2(1.00, 3.60),  // shoulder start
    new THREE.Vector2(0.95, 3.75),  // upper shoulder bevel
    new THREE.Vector2(0.62, 4.05),  // neck start
    new THREE.Vector2(0.55, 4.15),  // neck
    new THREE.Vector2(0.55, 4.35),  // top of neck
  ];
  const bodyGeo = new THREE.LatheGeometry(pts, 96);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x0a0a0a, roughness: 0.55, metalness: 0.1,
    envMap, envMapIntensity: 0.8,
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = body.receiveShadow = true;
  g.add(body);

  /* Cap — glossy plastic cylinder */
  const capGeo = new THREE.CylinderGeometry(0.62, 0.62, 0.45, 64);
  const capMat = new THREE.MeshStandardMaterial({
    color: 0x050505, roughness: 0.15, metalness: 0.3,
    envMap, envMapIntensity: 1.0,
  });
  const cap = new THREE.Mesh(capGeo, capMat);
  cap.position.y = 4.575;  // 4.35 (neck top) + 0.45/2
  cap.castShadow = true;
  g.add(cap);

  /* Cap grip ridges — 5 thin torus rings */
  const ridgeMat = new THREE.MeshStandardMaterial({
    color: 0x080808, roughness: 0.25, metalness: 0.2, envMap,
  });
  for (let i = 0; i < 5; i++) {
    const ridge = new THREE.Mesh(
      new THREE.TorusGeometry(0.626, 0.018, 8, 64),
      ridgeMat
    );
    ridge.position.y = 4.37 + i * 0.085;
    ridge.rotation.x = Math.PI / 2;
    ridge.castShadow = true;
    g.add(ridge);
  }

  /* Label — transparent cylinder (r=1.005) wrapping the body, y=0.4-3.5 */
  const labelTex = buildLabel(cfg);
  const labelGeo = new THREE.CylinderGeometry(1.005, 1.005, 3.1, 96, 1, true);
  const labelMat = new THREE.MeshBasicMaterial({
    map: labelTex, transparent: true, depthWrite: false, side: THREE.FrontSide,
  });
  const label = new THREE.Mesh(labelGeo, labelMat);
  label.position.y = 1.95;  // midpoint of 0.4 – 3.5
  g.add(label);

  /* Floor shadow blob */
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(1.3, 32),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.001;
  g.add(shadow);

  return g;
}

/* ═══════════════════════════════════════════════════════════════
   BOTTLE CONFIGS
   Three bottles, 2.8 units apart on X.
   Add a 4th entry here (x: ±5.6 or wherever) to extend the scene.
   ═══════════════════════════════════════════════════════════════ */
const bottleConfigs = [
  {
    x: -2.8,
    productLine: 'Universal / Allzweck',
    subtitle:    'Professional Cleaner',
    benefits:    ['Removes dirt', 'Streak-free finish', 'Safe on all surfaces'],
    heroNumber:  '1',
  },
  {
    x: 0,
    productLine: 'Sanitar / Bad-Reiniger',
    subtitle:    'Bathroom Acid',
    benefits:    ['Removes limescale', 'Kills bacteria', 'Restores shine'],
    heroNumber:  '2',
  },
  {
    x: 2.8,
    productLine: 'Kraft / Entfetter',
    subtitle:    'Heavy Duty Degreaser',
    benefits:    ['Cuts through grease', 'Industrial strength', 'Concentrate 1:20'],
    heroNumber:  '3',
  },
];

bottleConfigs.forEach(cfg => scene.add(createBottle(cfg)));

/* ═══════════════════════════════════════════════════════════════
   UI BUTTON LOGIC
   ═══════════════════════════════════════════════════════════════ */
const INIT_POS    = new THREE.Vector3(0, 2.5, 13);
const INIT_TARGET = new THREE.Vector3(0, 1.8,  0);

// Smooth camera animation (ease-in-out quad)
function animateTo(toPos, toTarget, ms = 900) {
  const fp = camera.position.clone();
  const ft = controls.target.clone();
  const t0 = performance.now();
  (function step(now) {
    const raw = Math.min((now - t0) / ms, 1);
    const e   = raw < 0.5 ? 2 * raw * raw : -1 + (4 - 2 * raw) * raw;
    camera.position.lerpVectors(fp, toPos, e);
    controls.target.lerpVectors(ft, toTarget, e);
    controls.update();
    if (raw < 1) requestAnimationFrame(step);
  })(t0);
}

const btnRot = document.getElementById('btn-rot');
btnRot.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnRot.classList.toggle('on', controls.autoRotate);
});
document.getElementById('btn-rst').addEventListener('click', () => {
  animateTo(INIT_POS, INIT_TARGET);
});
document.getElementById('btn-frt').addEventListener('click', () => {
  animateTo(new THREE.Vector3(0, 2.5, 13), new THREE.Vector3(0, 1.8, 0));
});
document.getElementById('btn-cls').addEventListener('click', () => {
  animateTo(new THREE.Vector3(0, 2.0, 6), new THREE.Vector3(0, 2.0, 0));
});

/* ═══════════════════════════════════════════════════════════════
   RENDER LOOP
   ═══════════════════════════════════════════════════════════════ */
const loading = document.getElementById('loading');
let   firstFrame = true;

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);

  // Fade out loading screen on first rendered frame
  if (firstFrame) {
    firstFrame = false;
    setTimeout(() => {
      loading.classList.add('fade');
      setTimeout(() => loading.style.display = 'none', 850);
    }, 200);
  }
})();
</script>
</body>
</html>
